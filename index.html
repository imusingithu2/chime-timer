<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chime Timer">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A timer with extra rings at custom times.">
  <title>Chime Timer</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/picker.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/running.css">
</head>
<body>
  <div id="app">

    <!-- ===== Main screen ===== -->
    <main id="main-screen" class="screen">
      <div id="wheels"></div>

      <div class="button-row">
        <button id="btn-cancel" class="circle-btn cancel" type="button" disabled>Cancel</button>
        <button id="btn-start" class="circle-btn start" type="button" disabled>Start</button>
      </div>

      <div class="group">
        <div class="card">
          <button id="row-label" class="row" type="button">
            <span class="row-main">Label</span>
            <span id="val-label" class="row-value">None</span><span class="chevron"></span>
          </button>
          <button id="row-end" class="row" type="button">
            <span class="row-main">When Timer Ends</span>
            <span id="val-end" class="row-value">Bell, 3 s</span><span class="chevron"></span>
          </button>
        </div>
      </div>

      <div class="group">
        <div class="group-head">
          <span class="group-title">Chimes</span>
          <button id="btn-edit-chimes" class="link-btn" type="button" hidden>Edit</button>
        </div>
        <div id="chimes-list" class="card"></div>
      </div>

      <div class="group">
        <div class="group-head">
          <span class="group-title">Recents</span>
          <button id="btn-edit-recents" class="link-btn" type="button" hidden>Edit</button>
        </div>
        <div id="recents-list" class="card"></div>
      </div>

      <div class="group">
        <div class="card">
          <button id="row-settings" class="row" type="button">
            <span class="row-main">Settings</span><span class="chevron"></span>
          </button>
        </div>
      </div>
      <p id="footnote" class="footnote"></p>
    </main>

    <!-- ===== Running / paused / ended screen ===== -->
    <section id="running-screen" class="running-screen" hidden>
      <div class="run-inner">
        <div id="run-title" class="run-title"></div>

        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 300 300" aria-hidden="true">
            <circle class="ring-track" cx="150" cy="150" r="140"></circle>
            <circle id="ring-progress" class="ring-progress" cx="150" cy="150" r="140"></circle>
            <g id="ring-ticks"></g>
          </svg>
          <div class="ring-center">
            <div id="run-time" class="run-time" role="timer" aria-live="off">0:00</div>
            <div class="run-end">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.4 2.4 0 0 0 2.4-2.4H9.6A2.4 2.4 0 0 0 12 22zm6.5-6.6v-5c0-3.1-1.6-5.6-4.5-6.3V3.4a2 2 0 0 0-4 0v.7C7.1 4.8 5.5 7.400 5.500 10.400v5L3.500 17.400v1.200h17v-1.200z"/></svg>
              <span id="run-end-text"></span>
            </div>
          </div>
        </div>

        <div class="button-row run-buttons">
          <button id="run-cancel" class="circle-btn cancel" type="button">Cancel</button>
          <button id="run-pause" class="circle-btn pause" type="button">Pause</button>
        </div>

        <div id="run-next" class="run-next"></div>
        <div id="run-chimes" class="card run-chimes" hidden></div>

        <div class="run-note">
          <svg id="lock-icon" viewBox="0 0 24 24" hidden aria-label="Screen is being kept on"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9zm-8-2a3 3 0 0 1 6 0v2H9z"/></svg>
          <span>Keep this app open and the screen on for chimes to ring.</span>
        </div>
        <div id="wake-tip" class="run-note" hidden>Tip: set Settings &gt; Display &amp; Brightness &gt; Auto-Lock to Never while using the timer.</div>
      </div>
    </section>

    <div id="chime-banner" class="chime-banner" hidden>
      <span id="chime-banner-text"></span>
      <button id="chime-banner-stop" class="pill-btn" type="button">Stop</button>
    </div>

    <!-- ===== Bottom sheet (label, end sound, chime editor, settings) ===== -->
    <div id="sheet-backdrop" class="sheet-backdrop"></div>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grabber"></div>
      <div class="sheet-header">
        <button id="sheet-cancel" class="sheet-btn cancel" type="button">Cancel</button>
        <div id="sheet-title" class="sheet-title"></div>
        <button id="sheet-done" class="sheet-btn done" type="button">Done</button>
      </div>
      <div id="sheet-content" class="sheet-content"></div>
    </div>

    <div id="banner" class="banner" role="status" hidden></div>
    <div id="error-banner" role="alert" hidden></div>
  </div>

  <noscript><p style="padding:24px;color:#fff">Chime Timer needs JavaScript.</p></noscript>

  <!-- Classic scripts (no ES modules). Order matters. -->
  <script src="./js/version.js"></script>
  <script src="./js/engine.js"></script>
  <script src="./js/platform.js"></script>
  <script src="./js/ui-widgets.js"></script>
  <script src="./js/ui-chimes.js"></script>
  <script src="./js/ui-running.js"></script>
  <script src="./js/ui-main.js"></script>
</body>
</html>
